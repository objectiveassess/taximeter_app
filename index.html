<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 확대 방지 및 모바일 뷰포트 고정, viewport-fit=cover로 노치 영역까지 화면 확장 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Miso TAXI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
    
    * {
      /* 모바일 터치 시 번쩍거리는 하이라이트 색상 제거 (앱처럼 보이게) */
      -webkit-tap-highlight-color: transparent;
    }
    
    body { 
      /* 당겨서 새로고침 방지 및 불필요한 스크롤 완벽 차단 */
      overscroll-behavior: none; 
      touch-action: none;
    }
    
    .font-digital {
      font-family: 'Share Tech Mono', monospace;
    }
    
    @keyframes gallop {
      0% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0); }
    }
    
    .galloping {
      animation: gallop 0.3s infinite linear;
    }
    
    /* 아이폰 노치/다이내믹 아일랜드 및 하단 홈 바 영역 침범 방지 */
    .safe-area-container {
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }
  </style>
</head>
<body class="bg-gray-950 text-white flex items-center justify-center m-0 p-0 font-sans select-none h-[100dvh] w-screen overflow-hidden">

  <!-- safe-area-container 클래스 추가로 노치와 홈바 영역 확보 -->
  <div class="safe-area-container flex flex-col h-full w-full bg-gray-950 sm:max-w-md sm:mx-auto sm:border sm:border-gray-800 sm:shadow-2xl overflow-hidden relative">
    
    <!-- 상단 헤더 -->
    <header class="flex justify-between items-center px-5 py-4 bg-gray-900 border-b border-gray-800 shrink-0">
      <h1 class="text-xl font-black tracking-wider text-yellow-400">Miso TAXI</h1>
      <span id="status-badge" class="text-xs font-bold px-3 py-1 bg-green-500/20 text-green-500 rounded-full border border-green-500/50">
        빈차
      </span>
    </header>

    <!-- 메인 화면 -->
    <main class="flex-1 flex flex-col justify-between p-4 sm:p-6 w-full max-h-full">
      
      <!-- 요금 표시부 -->
      <div class="flex flex-col w-full bg-gray-900/80 rounded-3xl p-5 sm:p-6 border border-gray-800 shadow-[inset_0_2px_20px_rgba(0,0,0,0.5)] relative flex-1 min-h-[160px] justify-between mb-4">
        <div class="flex justify-between items-start w-full">
          <div class="w-14 h-10 flex items-center justify-center bg-gray-950/50 rounded-xl border border-gray-800/80">
            <div id="horse-animation" class="text-2xl text-yellow-400">🐎</div>
          </div>
          <p class="text-gray-400 text-xs sm:text-sm font-medium pt-1">현재 요금</p>
        </div>

        <div class="flex items-baseline justify-end space-x-2 w-full mt-2">
          <span id="fare-display" class="text-6xl sm:text-7xl font-black text-yellow-400 font-digital tracking-tighter truncate">
            4,000
          </span>
          <span class="text-2xl sm:text-3xl font-bold text-yellow-400 shrink-0">원</span>
        </div>
      </div>

      <!-- 상태 정보 그리드 -->
      <div class="grid grid-cols-2 gap-3 w-full mb-4 shrink-0">
        <div class="bg-gray-900 rounded-2xl p-4 flex flex-col items-center border border-gray-800 shadow-sm">
          <span class="text-gray-500 text-[10px] sm:text-xs font-bold mb-1">이동 거리</span>
          <span class="text-xl sm:text-2xl font-bold font-digital text-blue-400">
            <span id="distance-display">0.00</span> <span class="text-xs font-sans">km</span>
          </span>
        </div>
        
        <div class="bg-gray-900 rounded-2xl p-4 flex flex-col items-center border border-gray-800 shadow-sm">
          <span class="text-gray-500 text-[10px] sm:text-xs font-bold mb-1">경과 시간</span>
          <span id="time-display" class="text-xl sm:text-2xl font-bold font-digital text-green-400">
            00:00
          </span>
        </div>
      </div>

      <!-- 제어 버튼들 (touch-action 포함하여 반응속도 극대화) -->
      <div class="grid grid-cols-5 gap-1.5 sm:gap-2 w-full shrink-0 pb-2">
        <button id="btn-vacant" class="h-14 sm:h-16 flex flex-col items-center justify-center rounded-xl text-xs sm:text-sm font-black border bg-green-500 border-green-600 text-gray-950 shadow-lg active:scale-95 transition-all">빈차</button>
        <button id="btn-driving" class="h-14 sm:h-16 flex flex-col items-center justify-center rounded-xl text-xs sm:text-sm font-black border bg-red-500 border-red-600 text-white shadow-lg active:scale-95 transition-all">주행</button>
        <button id="btn-extra" class="h-14 sm:h-16 flex flex-col items-center justify-center rounded-xl text-xs sm:text-sm font-black border bg-orange-500 border-orange-600 text-white shadow-lg active:scale-95 transition-all">할증</button>
        <button id="btn-complex" class="h-14 sm:h-16 flex flex-col items-center justify-center rounded-xl text-xs sm:text-sm font-black border bg-blue-500 border-blue-600 text-white shadow-lg active:scale-95 transition-all">복합</button>
        <button id="btn-paid" class="h-14 sm:h-16 flex flex-col items-center justify-center rounded-xl text-xs sm:text-sm font-black border bg-gray-600 border-gray-700 text-white shadow-lg active:scale-95 transition-all">지불</button>
      </div>
    </main>
  </div>

  <script>
    // --- 설정 및 변수 ---
    const DAEGU_BASE_FARE = 4000;       
    const DAEGU_DIST_FARE_M = 130;     
    const DAEGU_TIME_FARE_S = 31;      
    const ADD_FARE_UNIT = 100;         
    const SURCHARGE_RATE = 1.2;       
    const COMPLEX_RATE = 1.4;         

    let status = 'vacant'; 
    let distance = 0;      
    let time = 0;         
    let fare = DAEGU_BASE_FARE; 
    
    let intervalId = null;
    let watchId = null;
    let prevPosition = null;
    let wakeLock = null;

    // --- HTML 엘리먼트 ---
    const badge = document.getElementById('status-badge');
    const fareDisplay = document.getElementById('fare-display');
    const distanceDisplay = document.getElementById('distance-display');
    const timeDisplay = document.getElementById('time-display');
    const horseAnimation = document.getElementById('horse-animation');
    const buttons = {
      vacant: document.getElementById('btn-vacant'),
      driving: document.getElementById('btn-driving'),
      extra: document.getElementById('btn-extra'),
      complex: document.getElementById('btn-complex'),
      paid: document.getElementById('btn-paid')
    };

    // --- 화면 꺼짐 방지 (Wake Lock) ---
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.error('화면 꺼짐 방지 실패:', err.name, err.message);
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        requestWakeLock();
      }
    });

    // --- 거리 계산 ---
    function getDistanceFromLatLonInM(lat1, lon1, lat2, lon2) {
      const R = 6371e3; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // --- UI 업데이트 ---
    function updateUI() {
      fareDisplay.textContent = fare.toLocaleString();
      distanceDisplay.textContent = (distance / 1000).toFixed(2);
      const mins = Math.floor(time / 60).toString().padStart(2, '0');
      const secs = (time % 60).toString().padStart(2, '0');
      timeDisplay.textContent = `${mins}:${secs}`;

      if (status === 'driving' || status === 'extra' || status === 'complex') {
        horseAnimation.classList.add('galloping');
        badge.textContent = status === 'driving' ? '운행중' : (status === 'extra' ? '할증' : '복합');
        badge.className = 'text-xs font-bold px-3 py-1 bg-red-500/20 text-red-500 rounded-full animate-pulse border border-red-500/50';
      } else {
        horseAnimation.classList.remove('galloping');
        badge.textContent = status === 'vacant' ? '빈차' : '지불';
        badge.className = `text-xs font-bold px-3 py-1 ${status === 'vacant' ? 'bg-green-500/20 text-green-500' : 'bg-gray-500/20 text-gray-500'} rounded-full border border-green-500/50`;
      }
    }

    // --- 요금 계산 ---
    function calculateFare() {
      const timeToDistance = time * (DAEGU_DIST_FARE_M / DAEGU_TIME_FARE_S);
      const totalEquivalentDistance = distance + timeToDistance;

      if (totalEquivalentDistance <= 2000) {
        fare = DAEGU_BASE_FARE;
        return; 
      }

      const extraDist = totalEquivalentDistance - 2000;
      const extraFareAmount = Math.floor(extraDist / DAEGU_DIST_FARE_M) * ADD_FARE_UNIT;
      
      let totalFare = DAEGU_BASE_FARE + extraFareAmount;

      if (status === 'extra') {
        totalFare = Math.round((totalFare * SURCHARGE_RATE) / 100) * 100;
      } else if (status === 'complex') {
        totalFare = Math.round((totalFare * COMPLEX_RATE) / 100) * 100;
      }

      fare = totalFare;
    }

    // --- 기능 제어 ---
    function startMeter() {
      status = 'driving';
      distance = 0;
      time = 0;
      prevPosition = null;
      fare = DAEGU_BASE_FARE;

      requestWakeLock(); 

      intervalId = setInterval(() => {
        time++;
        calculateFare();
        updateUI();
      }, 1000);

      if ("geolocation" in navigator) {
        watchId = navigator.geolocation.watchPosition(
          (position) => {
            const currentPosition = position.coords;
            if (prevPosition) {
              const d = getDistanceFromLatLonInM(prevPosition.latitude, prevPosition.longitude, currentPosition.latitude, currentPosition.longitude);
              if (d > 5) { distance += d; }
            }
            prevPosition = currentPosition;
            calculateFare();
            updateUI();
          },
          (error) => { console.error("GPS 수신 오류:", error.message); },
          { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
      } else { alert("GPS 기능을 사용할 수 없는 기기입니다."); }
    }

    function stopMeter() {
      clearInterval(intervalId);
      if (watchId) navigator.geolocation.clearWatch(watchId);
      releaseWakeLock(); 
    }

    function resetMeter() {
      stopMeter();
      status = 'vacant';
      fare = DAEGU_BASE_FARE;
      distance = 0;
      time = 0;
      prevPosition = null;
      updateUI();
    }

    // --- 이벤트 리스너 ---
    buttons.vacant.addEventListener('click', () => { resetMeter(); });
    buttons.driving.addEventListener('click', () => { resetMeter(); startMeter(); });
    
    buttons.extra.addEventListener('click', () => {
      if (status === 'driving' || status === 'extra' || status === 'complex') {
        status = 'extra';
        calculateFare();
        updateUI();
      }
    });

    buttons.complex.addEventListener('click', () => {
      if (status === 'driving' || status === 'extra' || status === 'complex') {
        status = 'complex';
        calculateFare();
        updateUI();
      }
    });

    buttons.paid.addEventListener('click', () => {
      if (status === 'driving' || status === 'extra' || status === 'complex') {
        stopMeter();
        status = 'paid';
        updateUI();
      }
    });

    updateUI();
  </script>
</body>
</html>
